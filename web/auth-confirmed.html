<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Email confirmed · Guinea Pig</title>
  <!--
    Guinea Pig — signup email-confirmation landing.
    Host at: https://guineapigapp.co.uk/auth/confirmed
    Set it as the app's signUp emailRedirectTo and add to Supabase Redirect URLs when
    re-enabling email confirmation. Confirmation completes SERVER-SIDE when Supabase
    verifies the token, so this page is just a friendly landing — no keys or logic needed.
  -->
  <style>
    :root{--rose:#F45D9E;--cream:#FBF6F1;--warmDark:#3A302C;--muted:#8A7F79;--border:#EADFD6;--white:#fff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--cream);color:var(--warmDark);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:24px}
    .card{width:100%;max-width:400px;background:var(--white);border:1px solid var(--border);border-radius:20px;padding:32px 24px;box-shadow:0 10px 30px rgba(58,48,44,.08);text-align:center}
    .brand{font-size:14px;font-weight:700;letter-spacing:.3px;color:var(--rose);margin-bottom:8px}
    .big{font-size:44px;line-height:1;margin-bottom:10px}
    h1{font-size:22px;margin:0 0 8px}
    p{margin:0;color:var(--muted);font-size:15px;line-height:1.55}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">GUINEA PIG</div>
    <div class="big">🎉</div>
    <h1>Email confirmed</h1>
    <p>Your email is verified. Open the Guinea Pig app and log in to get started.</p>
  </div>
</body>
</html>
