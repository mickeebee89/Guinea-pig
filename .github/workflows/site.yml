# ==========================================================================
#  site — checks on push
#
#  ⚠️ THIS IS A SIGNAL, NOT A GATE.
#
#  It runs AFTER the commit is on main. Nothing here can stop a bad commit
#  landing; it can only tell you one did. Branch protection requiring this
#  check is what would make it a gate, and that is deliberately NOT on —
#  commit-direct-to-main is a considered choice for a solo project, and
#  requiring pull requests to enforce a check that already arrives as a
#  notification would change how the work is done to buy nothing.
#
#  Do not let "CI is wired" get read later as "commits are checked".
#  Audit item 28 says the same thing in more words.
#
#  ── WHY THREE WORKFLOWS AND NOT ONE ──────────────────────────────────────
#  `on.push.paths` is a workflow-level filter, not a job-level one. One
#  workflow would either run all three apps on every push or need a
#  change-detection job that itself runs every time. The three apps share no
#  code — separate package.json, separate lockfiles, no workspace linkage —
#  so a per-app workflow means a mobile-only commit runs only mobile, and
#  each app gets its own status rather than hiding behind another's failure.
# ==========================================================================
name: site

# ⚠️ `supabase/functions/**` is in this list on purpose, and it is not a
# mistake that a backend path triggers the site's workflow: since 22 Sep 2026
# check-links.mjs reads the edge functions for `${SITE}/…` URLs, so renaming a
# page there can break a link here (item 74). Without this, d0b0fb2's two
# follow-up commits touched no site/ file, this workflow never ran, and Vercel
# failed both deploys with nothing red anywhere (item 75).
on:
  push:
    paths:
      - 'site/**'
      - 'supabase/functions/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'supabase/functions/**'
      - '.github/workflows/site.yml'
  # So it can be run by hand without touching a file.
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # Three lockfiles in this repo, so the cache has to be told which.
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # Two steps, not `npm run verify`, so the GitHub UI names which half
      # failed.
      #
      # ⚠️ SINCE 22 Sep 2026 THIS IS THE ONLY PLACE THE CHECKS RUN. Vercel's
      # `npm run build` is now `next build` alone, so a check failing here
      # turns this tick red and does NOT stop the website updating. That is
      # the point: on 22 Sep a link check stopped three Production deploys for
      # nine hours over two routes that were perfectly fine (items 74, 75).
      # If this job is ever deleted, the checks stop running anywhere at all.
      - name: checks (eslint + the four custom scripts)
        run: npm run checks

      # ── WHY THIS STEP EXISTS, AND WHAT IT COST TO LEARN ──────────────────
      #
      # `checks` never compiles anything. It is eslint plus three scripts that
      # read source as text, so a TYPE error is invisible to it — and `site` is
      # the only one of the three apps whose `checks` omits `tsc --noEmit`,
      # deliberately, because site/README.md reasoned that `next build`
      # type-checks anyway. True for a deploy. False for CI, which never built.
      #
      # On 8 Sep 2026 a duplicate `let` reached lib/queries/dashboard.ts.
      # eslint passed it. Every Vercel build errored. cavybeauty.com served the
      # 10 August build for five weeks while this workflow reported green, and
      # the green tick is what made two red deploys easy to skip past.
      #
      # Audit items 28 and 45: a signal you watch can hide a signal you don't,
      # when the watched one is narrower than the thing it appears to certify.
      #
      # 15s for checks, 30s for the build. The tradeoff I assumed existed does
      # not.
      - name: next build (what Vercel actually runs)
        run: npx next build
        env:
          # Read by supabase-public.ts (public pages) and supabase-server.ts
          # (the member area's server client). Without them the module throws
          # at import and the build dies before compiling anything.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # Mirrors site/.env.local, where the NEXT_PUBLIC_ pair are $VAR
          # references to the two above rather than separate values.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          # NEVER `live` here. A preview artefact that thinks it is live would
          # emit an indexable robots.txt and a real sitemap. lib/site.ts says
          # the same thing.
          PUBLIC_SITE_MODE: preview

      # ⚠️ CI BUILDS AGAINST A DIFFERENT KEY GENERATION THAN VERCEL DOES.
      # These variables hold `sb_publishable_…` keys, matching site/.env.local.
      # Vercel's four Supabase variables are all legacy `eyJ…` JWTs. One
      # generation each side, consistently — audit item 38. So a green run here
      # plus a green Vercel deploy of the same commit is the first real evidence
      # that both generations work, rather than an assumption. If one goes red
      # while the other stays green, read that difference before anything else.
